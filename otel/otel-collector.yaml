receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  
  # Add resource attributes for correlation
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert
      - key: region
        value: local
        action: upsert

exporters:
  otlphttp/elastic:
    endpoint: ${env:ELASTIC_CLOUD_ENDPOINT}
    headers:
      Authorization: "ApiKey ${env:ELASTIC_API_KEY}"
    tls:
      insecure: false
    compression: none

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/elastic]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/elastic]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/elastic]
